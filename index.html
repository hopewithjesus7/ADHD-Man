<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="theme-color" content="#eaf0ec" />
<meta name="apple-mobile-web-app-title" content="60초 리셋" />
<title>60초 리셋</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
<link rel="stylesheet" as="style" crossorigin
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<style>
:root{
  --bg-0:#eef2ee;
  --bg-1:#e6edef;
  --sage:#a9c6b4;
  --sky:#aecadb;
  --cream:#ecdfca;
  --ink:#2c3733;
  --ink-soft:#67726c;
  --ink-faint:#9aa39d;
  --accent:#6f9e8f;
  --accent-deep:#557e72;
  --glass:rgba(255,255,255,.55);
  --glass-strong:rgba(255,255,255,.72);
  --glass-line:rgba(255,255,255,.65);
  --shadow:0 18px 50px -22px rgba(50,70,62,.45);
  --shadow-soft:0 10px 30px -16px rgba(50,70,62,.4);
  --r:26px;
  --ease:cubic-bezier(.22,.61,.36,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;margin:0;}
body{
  font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  color:var(--ink);
  background:var(--bg-0);
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}

/* ---------- ambient aurora background ---------- */
.aurora{position:fixed;inset:0;z-index:-2;overflow:hidden;background:
  linear-gradient(160deg,var(--bg-0),var(--bg-1));}
.aurora span{position:absolute;border-radius:50%;filter:blur(60px);opacity:.6;
  mix-blend-mode:multiply;will-change:transform;}
.blob1{width:62vmax;height:62vmax;left:-22vmax;top:-26vmax;background:radial-gradient(circle,var(--sage),transparent 68%);animation:drift1 26s var(--ease) infinite alternate;}
.blob2{width:54vmax;height:54vmax;right:-20vmax;top:-10vmax;background:radial-gradient(circle,var(--sky),transparent 68%);animation:drift2 32s var(--ease) infinite alternate;}
.blob3{width:50vmax;height:50vmax;left:8vmax;bottom:-28vmax;background:radial-gradient(circle,var(--cream),transparent 70%);animation:drift3 30s var(--ease) infinite alternate;}
@keyframes drift1{to{transform:translate3d(8vmax,10vmax,0) scale(1.12);}}
@keyframes drift2{to{transform:translate3d(-7vmax,9vmax,0) scale(1.08);}}
@keyframes drift3{to{transform:translate3d(6vmax,-8vmax,0) scale(1.1);}}
.grain{position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.035;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");}

/* ---------- layout ---------- */
#app{position:relative;height:100dvh;width:100%;display:flex;align-items:center;justify-content:center;
  padding:max(22px,env(safe-area-inset-top)) 22px max(26px,env(safe-area-inset-bottom));}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:max(40px,env(safe-area-inset-top)) 24px max(36px,env(safe-area-inset-bottom));
  gap:22px;text-align:center;opacity:0;transform:translateY(14px) scale(.992);
  pointer-events:none;transition:opacity .6s var(--ease),transform .6s var(--ease);}
.screen.active{opacity:1;transform:none;pointer-events:auto;}
.wrap{width:100%;max-width:440px;display:flex;flex-direction:column;align-items:center;gap:22px;}

/* ---------- typography ---------- */
.kicker{font-size:14px;letter-spacing:.04em;color:var(--ink-soft);font-weight:500;}
.title{font-size:clamp(23px,6.4vw,30px);font-weight:700;line-height:1.45;letter-spacing:-.01em;}
.lead{font-size:17px;line-height:1.7;color:var(--ink-soft);font-weight:450;}
.fade-line{font-size:15px;color:var(--accent-deep);font-weight:500;min-height:21px;}

/* ---------- glass buttons ---------- */
.btn{position:relative;overflow:hidden;border:1px solid var(--glass-line);
  background:var(--glass);backdrop-filter:blur(16px) saturate(1.3);-webkit-backdrop-filter:blur(16px) saturate(1.3);
  color:var(--ink);font-family:inherit;font-weight:600;cursor:pointer;
  border-radius:var(--r);box-shadow:var(--shadow-soft);transition:transform .35s var(--ease),box-shadow .35s var(--ease),background .35s var(--ease);
  -webkit-user-select:none;user-select:none;}
.btn:active{transform:scale(.975);}
.btn-xl{width:100%;padding:26px 22px;font-size:20px;display:flex;flex-direction:column;align-items:center;gap:8px;}
.btn-xl .emoji{font-size:30px;line-height:1;}
.btn-xl .sub{font-size:13px;font-weight:450;color:var(--ink-soft);}
.btn-row{display:flex;gap:14px;width:100%;}
.btn-row .btn-xl{flex:1;}
.btn-primary{width:100%;padding:20px;font-size:18px;background:linear-gradient(135deg,var(--accent),var(--accent-deep));
  color:#fff;border-color:transparent;box-shadow:0 16px 36px -16px rgba(85,126,114,.7);}
.btn-ghost{width:100%;padding:16px;font-size:15px;font-weight:500;color:var(--ink-soft);
  background:transparent;border-color:transparent;box-shadow:none;}
.btn-soft{width:100%;padding:18px;font-size:16px;}
.ripple{position:absolute;border-radius:50%;transform:translate(-50%,-50%) scale(0);
  background:radial-gradient(circle,rgba(255,255,255,.85),rgba(255,255,255,0) 70%);
  pointer-events:none;animation:rip .7s var(--ease) forwards;mix-blend-mode:overlay;}
@keyframes rip{to{transform:translate(-50%,-50%) scale(1);opacity:0;}}

/* small entry / link */
.softlink{background:none;border:none;color:var(--ink-soft);font-family:inherit;font-size:15px;
  font-weight:500;cursor:pointer;padding:12px 16px;border-radius:16px;transition:color .3s;}
.softlink:active{color:var(--accent-deep);}

/* home mode pills (말씀 / 호흡 / 기도) */
.modes{display:flex;flex-direction:column;gap:13px;width:100%;}
.mode{display:flex;align-items:center;gap:16px;width:100%;padding:20px 22px;text-align:left;}
.mode .emoji{font-size:26px;line-height:1;flex:none;}
.mode .t{font-size:18px;font-weight:650;display:block;}
.mode .sub{font-size:13px;font-weight:450;color:var(--ink-soft);display:block;margin-top:2px;}

/* prayer mode */
.prayer-stage{position:relative;width:100%;min-height:210px;display:flex;align-items:center;justify-content:center;}
.prayer-glow{position:absolute;width:300px;height:300px;border-radius:50%;
  background:radial-gradient(circle,rgba(174,202,219,.42),rgba(169,198,180,.18) 45%,transparent 72%);
  filter:blur(14px);animation:glowpulse 9s ease-in-out infinite;}
@keyframes glowpulse{0%,100%{opacity:.5;transform:scale(.95);}50%{opacity:.85;transform:scale(1.06);}}
.prayer-line{position:relative;z-index:2;font-size:22px;font-weight:600;line-height:1.6;
  max-width:300px;letter-spacing:-.01em;transition:opacity .8s ease;}

/* corner controls */
.corner{position:fixed;top:max(16px,env(safe-area-inset-top));right:18px;display:flex;gap:6px;z-index:20;}
.icon-btn{width:42px;height:42px;border-radius:14px;border:1px solid var(--glass-line);
  background:var(--glass);backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:center;
  font-size:18px;color:var(--ink-soft);cursor:pointer;transition:transform .3s var(--ease);}
.icon-btn:active{transform:scale(.9);}

/* ---------- breathing orb ---------- */
.orb-stage{position:relative;width:260px;height:260px;display:flex;align-items:center;justify-content:center;}
.orb{position:absolute;width:150px;height:150px;border-radius:50%;
  background:radial-gradient(circle at 38% 32%,#ffffff,var(--sage) 58%,var(--accent) 100%);
  box-shadow:0 0 60px 10px rgba(111,158,143,.45),inset 0 0 40px rgba(255,255,255,.6);
  animation:breathe 10s var(--ease) infinite;}
.orb-halo{position:absolute;width:220px;height:220px;border-radius:50%;
  background:radial-gradient(circle,rgba(174,202,219,.5),transparent 65%);filter:blur(8px);
  animation:breathe 10s var(--ease) infinite;}
@keyframes breathe{
  0%{transform:scale(.78);}
  40%{transform:scale(1.18);}   /* 4s in */
  50%{transform:scale(1.18);}
  100%{transform:scale(.78);}   /* 6s out */
}
.orb-word{position:relative;z-index:2;font-size:18px;font-weight:600;color:#fff;
  text-shadow:0 1px 10px rgba(60,90,80,.4);letter-spacing:.02em;}

/* ---------- verse ---------- */
.verse-card{width:100%;background:var(--glass-strong);border:1px solid var(--glass-line);
  border-radius:var(--r);box-shadow:var(--shadow);padding:30px 26px;backdrop-filter:blur(18px);
  display:flex;flex-direction:column;gap:18px;}
.verse-text{font-size:19px;line-height:1.85;font-weight:500;letter-spacing:-.01em;}
.verse-ref{font-size:14px;color:var(--accent-deep);font-weight:600;letter-spacing:.02em;}
.verse-pray{font-size:15px;line-height:1.7;color:var(--ink-soft);padding-top:16px;border-top:1px solid rgba(120,140,130,.18);}
.verse-empty{font-size:15px;color:var(--ink-faint);line-height:1.7;}

/* ---------- one-thing chips ---------- */
.chips{display:flex;flex-direction:column;gap:12px;width:100%;}
.chip{position:relative;overflow:hidden;width:100%;padding:20px;border-radius:20px;
  border:1px solid var(--glass-line);background:var(--glass);backdrop-filter:blur(14px);
  font-family:inherit;font-size:17px;font-weight:550;color:var(--ink);cursor:pointer;text-align:center;
  box-shadow:var(--shadow-soft);transition:transform .3s var(--ease);}
.chip:active{transform:scale(.97);}
.input{width:100%;padding:18px;border-radius:18px;border:1px solid var(--glass-line);
  background:var(--glass-strong);font-family:inherit;font-size:16px;color:var(--ink);
  text-align:center;outline:none;transition:border-color .3s,box-shadow .3s;}
.input::placeholder{color:var(--ink-faint);}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(111,158,143,.16);}

/* ---------- timer ring ---------- */
.ring-stage{position:relative;width:240px;height:240px;display:flex;align-items:center;justify-content:center;}
.ring-stage svg{position:absolute;inset:0;transform:rotate(-90deg);}
.ring-bg{fill:none;stroke:rgba(255,255,255,.55);stroke-width:10;}
.ring-fg{fill:none;stroke:url(#g);stroke-width:10;stroke-linecap:round;
  transition:stroke-dashoffset 1s linear;}
.ring-inner{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:6px;}
.ring-time{font-size:40px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.01em;}
.ring-thing{font-size:15px;color:var(--ink-soft);max-width:170px;line-height:1.5;}

/* ---------- log ---------- */
.stat{width:100%;background:var(--glass-strong);border:1px solid var(--glass-line);border-radius:var(--r);
  padding:24px;box-shadow:var(--shadow-soft);backdrop-filter:blur(16px);}
.stat-label{font-size:14px;color:var(--ink-soft);font-weight:500;}
.stat-num{font-size:46px;font-weight:700;color:var(--accent-deep);line-height:1.1;margin-top:6px;}
.log-list{width:100%;display:flex;flex-direction:column;gap:10px;max-height:34vh;overflow-y:auto;
  -webkit-overflow-scrolling:touch;}
.log-item{background:var(--glass);border:1px solid var(--glass-line);border-radius:16px;padding:14px 18px;
  font-size:15px;display:flex;justify-content:space-between;gap:12px;align-items:center;}
.log-item .when{font-size:13px;color:var(--ink-faint);flex:none;}

/* ---------- modal (settings / verse edit) ---------- */
.modal{position:fixed;inset:0;z-index:40;display:none;align-items:flex-end;justify-content:center;
  background:rgba(44,55,51,.32);backdrop-filter:blur(6px);}
.modal.open{display:flex;}
.sheet{width:100%;max-width:480px;background:var(--glass-strong);backdrop-filter:blur(26px);
  border:1px solid var(--glass-line);border-radius:28px 28px 0 0;box-shadow:0 -20px 60px -20px rgba(40,55,50,.4);
  padding:24px 24px max(28px,env(safe-area-inset-bottom));max-height:88dvh;overflow-y:auto;
  animation:rise .5s var(--ease);}
@keyframes rise{from{transform:translateY(100%);}to{transform:none;}}
.sheet h2{font-size:20px;margin:4px 0 18px;font-weight:700;}
.row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px 0;
  border-top:1px solid rgba(120,140,130,.16);}
.row:first-of-type{border-top:none;}
.row .label{font-size:15px;font-weight:550;}
.row .desc{font-size:13px;color:var(--ink-soft);margin-top:3px;line-height:1.5;}
.toggle{width:52px;height:31px;border-radius:16px;border:none;background:rgba(120,140,130,.3);
  position:relative;cursor:pointer;flex:none;transition:background .3s;}
.toggle.on{background:var(--accent);}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:25px;height:25px;border-radius:50%;
  background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2);transition:transform .3s var(--ease);}
.toggle.on::after{transform:translateX(21px);}
.seg{display:flex;gap:6px;}
.seg button{padding:9px 14px;border-radius:12px;border:1px solid var(--glass-line);background:var(--glass);
  font-family:inherit;font-size:14px;color:var(--ink-soft);cursor:pointer;font-weight:600;}
.seg button.sel{background:var(--accent);color:#fff;border-color:transparent;}
.time-in{padding:10px 12px;border-radius:12px;border:1px solid var(--glass-line);background:var(--glass);
  font-family:inherit;font-size:15px;color:var(--ink);}
.sheet textarea{width:100%;min-height:90px;border-radius:16px;border:1px solid var(--glass-line);
  background:var(--glass);font-family:inherit;font-size:15px;padding:14px;color:var(--ink);resize:vertical;outline:none;line-height:1.6;}
.sheet .hint{font-size:12.5px;color:var(--ink-faint);line-height:1.6;margin-top:10px;}
.sheet .verse-pick{font-size:14px;color:var(--accent-deep);font-weight:600;}
.close-x{float:right;font-size:15px;color:var(--ink-soft);background:none;border:none;cursor:pointer;font-family:inherit;}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms!important;transition-duration:.18s!important;}
  .orb,.orb-halo{animation:none;transform:scale(1);}
}
</style>
</head>
<body>
<div class="aurora"><span class="blob1"></span><span class="blob2"></span><span class="blob3"></span></div>
<div class="grain"></div>

<div class="corner">
  <button class="icon-btn" id="navLog" aria-label="기록">🌿</button>
  <button class="icon-btn" id="navSettings" aria-label="설정">⋯</button>
</div>

<div id="app">

  <!-- HOME -->
  <section class="screen" data-screen="home">
    <div class="wrap">
      <div class="fade-line" id="homeGreeting"></div>
      <div class="kicker">잠깐, 60초만.</div>
      <div class="modes">
        <button class="btn mode" data-go="word"><span class="emoji">🙏</span><span><span class="t">말씀</span><span class="sub">한 구절 읽기</span></span></button>
        <button class="btn mode" data-go="prayer"><span class="emoji">🕯️</span><span><span class="t">기도</span><span class="sub">눈 감고 천천히 주기도문</span></span></button>
        <button class="btn mode" data-go="breath"><span class="emoji">🌬️</span><span><span class="t">호흡</span><span class="sub">같이 숨 쉬기</span></span></button>
      </div>
      <button class="softlink" data-go="lol">🎮 롤 켜기 전이야?</button>
    </div>
  </section>

  <!-- BREATH -->
  <section class="screen" data-screen="breath">
    <div class="wrap">
      <div class="orb-stage">
        <div class="orb-halo"></div>
        <div class="orb"></div>
        <div class="orb-word" id="breathWord">들이쉬고…</div>
      </div>
      <button class="btn btn-soft" data-enough="breath">이거면 충분해</button>
    </div>
  </section>

  <!-- WORD -->
  <section class="screen" data-screen="word">
    <div class="wrap">
      <div class="verse-card">
        <div class="verse-ref" id="verseRef"></div>
        <div class="verse-text" id="verseText"></div>
        <div class="verse-pray" id="versePray"></div>
      </div>
      <button class="btn btn-soft" data-enough="word">이거면 충분해</button>
      <button class="softlink" id="verseAnother">다른 구절 보기</button>
    </div>
  </section>

  <!-- PRAYER -->
  <section class="screen" data-screen="prayer">
    <div class="wrap">
      <div class="prayer-stage">
        <div class="prayer-glow"></div>
        <div class="prayer-line" id="prayerLine"></div>
      </div>
      <div class="fade-line" id="prayerHint">눈 감고 외워도, 천천히 읽어도 좋아.</div>
      <button class="btn btn-soft" data-enough="prayer">이거면 충분해</button>
    </div>
  </section>

  <!-- ENOUGH -->
  <section class="screen" data-screen="enough">
    <div class="wrap">
      <div class="title">이거면 충분해.</div>
    </div>
  </section>

  <!-- ONE_THING -->
  <section class="screen" data-screen="one">
    <div class="wrap">
      <div class="title" id="oneTitle">지금 가볍게 시동 걸 거,<br>딱 하나만.</div>
      <div class="chips" id="oneChips"></div>
      <button class="softlink" id="oneReshuffle">🎲 다른 거 보여줘</button>
      <input class="input" id="oneInput" placeholder="직접 적어도 돼 (선택)" />
      <button class="btn-ghost" data-go="done">오늘은 여기까지 — 그것도 좋아</button>
    </div>
  </section>

  <!-- TIMER -->
  <section class="screen" data-screen="timer">
    <div class="wrap">
      <div class="ring-stage">
        <svg viewBox="0 0 240 240">
          <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#aecadb"/><stop offset="1" stop-color="#6f9e8f"/>
          </linearGradient></defs>
          <circle class="ring-bg" cx="120" cy="120" r="110"/>
          <circle class="ring-fg" id="ringFg" cx="120" cy="120" r="110"/>
        </svg>
        <div class="ring-inner">
          <div class="ring-time" id="ringTime">3:00</div>
          <div class="ring-thing" id="ringThing"></div>
        </div>
      </div>
      <div class="fade-line">3분. 이거 하나면 돼.</div>
      <button class="btn btn-soft" id="timerStop">이거면 충분해</button>
    </div>
  </section>

  <!-- LOL_FORK -->
  <section class="screen" data-screen="lol">
    <div class="wrap">
      <div class="title">이제 롤 켜도 돼 👍</div>
      <div class="lead">근데 3분만, 딱 하나 먼저 해볼래?</div>
      <button class="btn btn-primary" id="lolFirst">3분 먼저 해볼래</button>
      <button class="btn btn-ghost" id="lolGo">롤 ㄱㄱ</button>
    </div>
  </section>

  <!-- DONE -->
  <section class="screen" data-screen="done">
    <div class="wrap">
      <div class="title" id="doneText">해냈다. 진짜로.</div>
      <div class="lead" id="doneSub">닫아도 성공이야.</div>
      <button class="softlink" data-go="home">처음으로</button>
    </div>
  </section>

  <!-- LOG -->
  <section class="screen" data-screen="log">
    <div class="wrap">
      <div class="stat">
        <div class="stat-label">이번 주에 멈춰서 숨 쉰 횟수</div>
        <div class="stat-num" id="weekCount">0</div>
      </div>
      <div class="stat-label" style="align-self:flex-start;margin-left:4px;">오늘 건드린 것</div>
      <div class="log-list" id="logList"></div>
      <button class="softlink" data-go="home">처음으로</button>
    </div>
  </section>

</div>

<!-- SETTINGS modal -->
<div class="modal" id="settingsModal">
  <div class="sheet">
    <button class="close-x" data-close>닫기</button>
    <h2>설정</h2>

    <div class="row">
      <div>
        <div class="label">하루 넛지</div>
        <div class="desc">조용한 권유 한 번. 채근 아님.</div>
      </div>
      <button class="toggle" id="tgNudge"></button>
    </div>
    <div class="row" id="nudgeFreqRow">
      <div><div class="label">하루 몇 번</div><div class="desc">언제든 줄일 수 있어.</div></div>
      <div class="seg" id="nudgeFreq">
        <button data-n="1">1번</button><button data-n="2">2번</button><button data-n="3">3번</button>
      </div>
    </div>
    <div class="row" id="nudgeTimeRow">
      <div><div class="label">첫 시간</div><div class="desc">이때부터 고르게 나눠서.</div></div>
      <input class="time-in" type="time" id="nudgeTime" value="10:00" />
    </div>

    <div class="hint" id="nudgeHint"></div>
  </div>
</div>

<script>

function show(name){

  screens[name].classList.add("active");

/* ---------- 리플 이펙트 ---------- */
function ripple(e){
  const b=e.currentTarget; const r=b.getBoundingClientRect();
  const size=Math.max(r.width,r.height)*1.4;
  const s=document.createElement("span"); s.className="ripple";
  s.style.width=s.style.height=size+"px";
  s.style.left=((e.touches?e.touches[0].clientX:e.clientX)-r.left)+"px";
  s.style.top=((e.touches?e.touches[0].clientY:e.clientY)-r.top)+"px";
  b.appendChild(s); setTimeout(()=>s.remove(),700);
  if(navigator.vibrate) try{navigator.vibrate(8);}catch(_){}
}
document.querySelectorAll(".btn,.chip").forEach(b=>b.addEventListener("pointerdown",ripple));

/* ============================================================
   호흡
   ============================================================ */
let breathTimer=null;
function startBreath(){
  const w=document.getElementById("breathWord");
  let inhale=true; w.textContent="들이쉬고…";
  stopBreath();
  // 10s 사이클(들숨 4s/멈춤 1s/날숨 5s 근사) — 문구만 부드럽게 교차
  const cycle=()=>{ inhale=!inhale; w.style.opacity=0;
    setTimeout(()=>{ w.textContent=inhale?"들이쉬고…":"내쉬고…"; w.style.opacity=1; },400); };
  w.style.transition="opacity .4s ease";
  breathTimer=setInterval(cycle,5000);
}
function stopBreath(){ if(breathTimer){clearInterval(breathTimer);breathTimer=null;} }

];
let prayerTimer=null;
function startPrayer(){
  stopPrayer();

  hint.textContent="눈 감고 외워도, 천천히 읽어도 좋아.";

function pick3(){
  const a=ONE_POOL.slice(); const out=[];
  for(let i=0;i<3 && a.length;i++){ out.push(a.splice(Math.floor(Math.random()*a.length),1)[0]); }
  return out;
}
function renderChips(){
  const box=document.getElementById("oneChips"); box.innerHTML="";

/* ============================================================
   3분 타이머
   ============================================================ */
const TOTAL=180;
let timerId=null, remain=TOTAL;
const R=110, CIRC=2*Math.PI*R;
const ringFg=document.getElementById("ringFg");
ringFg.style.strokeDasharray=CIRC;
function fmt(s){ const m=Math.floor(s/60); const ss=s%60; return m+":"+String(ss).padStart(2,"0"); }
function startTimer(){
  remain=TOTAL;
  document.getElementById("ringThing").textContent=oneThing||"";
  document.getElementById("ringTime").textContent=fmt(remain);
  ringFg.style.strokeDashoffset=0;
  clearInterval(timerId);
  timerId=setInterval(()=>{
    remain--;
    document.getElementById("ringTime").textContent=fmt(Math.max(remain,0));
    ringFg.style.strokeDashoffset=CIRC*(1-remain/TOTAL);
    if(remain<=0){ clearInterval(timerId); logAdd("fivemin",oneThing); finishTimer(true); }
  },1000);
}
function finishTimer(complete){
  clearInterval(timerId);
  const d=document.getElementById("doneText"), s=document.getElementById("doneSub");
  if(complete){ d.textContent="해냈다. 진짜로."; s.textContent="닫아도 성공이야."; }
  else { d.textContent="이거면 충분해."; s.textContent="시작한 것만으로 충분해."; }
  show("done");
}
document.getElementById("timerStop").addEventListener("click",()=>{
  clearInterval(timerId);
  if(TOTAL-remain>0) logAdd("fivemin",oneThing); // 시작했으면 +1
  finishTimer(false);
});

/* ============================================================

function logAdd(type,thing){
  const log=load(K.log,[]);
  log.push({ts:new Date().toISOString(),type,thing:thing||undefined});
  save(K.log,log);
}
function renderLog(){
  const log=load(K.log,[]);
  // 이번 주(월~) 호흡/말씀 멈춤 횟수
  const now=new Date(); const day=(now.getDay()+6)%7;
  const weekStart=new Date(now); weekStart.setHours(0,0,0,0); weekStart.setDate(now.getDate()-day);
  const week=log.filter(e=>new Date(e.ts)>=weekStart && (e.type==="breath"||e.type==="word"||e.type==="prayer")).length;
  document.getElementById("weekCount").textContent=week;
  // 오늘 건드린 것
  const today=new Date(); today.setHours(0,0,0,0);
  const items=log.filter(e=>new Date(e.ts)>=today).slice().reverse();
  const list=document.getElementById("logList"); list.innerHTML="";
  if(!items.length){ const e=document.createElement("div"); e.className="log-item";
    e.innerHTML="<span style='color:var(--ink-faint)'>아직 비어 있어 — 그것도 괜찮아.</span>"; list.appendChild(e); }
  const names={breath:"🌬️ 호흡",word:"🙏 말씀",prayer:"🕯️ 기도",fivemin:"⏳ 3분"};
  items.forEach(e=>{
    const row=document.createElement("div"); row.className="log-item";
    const t=new Date(e.ts); const hm=String(t.getHours()).padStart(2,"0")+":"+String(t.getMinutes()).padStart(2,"0");
    row.innerHTML="<span>"+(e.thing?e.thing:names[e.type]||"기록")+"</span><span class='when'>"+hm+"</span>";
    list.appendChild(row);
  });
}

const tgNudge=document.getElementById("tgNudge");

const nudgeTime=document.getElementById("nudgeTime");
function syncSettingsUI(){
  tgNudge.classList.toggle("on",!!settings.nudgeEnabled);
  [...freqSeg.children].forEach(b=>b.classList.toggle("sel",+b.dataset.n===settings.nudgeCount));
  nudgeTime.value=settings.nudgeTime||"10:00";

    : "넛지는 꺼져 있어. 필요할 때만 켜.";
}
tgNudge.addEventListener("click",()=>{
  settings.nudgeEnabled=!settings.nudgeEnabled; save(K.settings,settings); syncSettingsUI();
  if(settings.nudgeEnabled && "Notification" in window && Notification.permission==="default"){ Notification.requestPermission().then(scheduleNudges); }
  scheduleNudges();
});
freqSeg.addEventListener("click",e=>{ if(e.target.dataset.n){ settings.nudgeCount=+e.target.dataset.n; save(K.settings,settings); syncSettingsUI(); scheduleNudges(); }});
nudgeTime.addEventListener("change",()=>{ settings.nudgeTime=nudgeTime.value; save(K.settings,settings); scheduleNudges(); });

/* ---------- 넛지 스케줄 (앱 열려 있을 때 best-effort) ---------- */
let nudgeTimers=[];
const NUDGE_MSGS=["60초만 멈춰 볼까? 🌬️","숨 한 번 쉬고 가자.","말씀 한 구절 어때? 🙏","이거면 충분해 — 잠깐 들러."];
function clearNudges(){ nudgeTimers.forEach(t=>clearTimeout(t)); nudgeTimers=[]; }
function scheduleNudges(){
  clearNudges();
  if(!settings.nudgeEnabled) return;
  if(!("Notification" in window) || Notification.permission!=="granted") return;
  const [h,m]=(settings.nudgeTime||"10:00").split(":").map(Number);
  const spanH=12; // 첫 시간부터 12시간에 걸쳐 고르게
  const now=new Date();
  for(let i=0;i<settings.nudgeCount;i++){
    const t=new Date(); t.setHours(h,m,0,0);
    t.setMinutes(t.getMinutes()+Math.round((spanH*60/Math.max(settings.nudgeCount,1))*i));
    let delay=t.getTime()-now.getTime();
    if(delay<0) delay+=86400000; // 지났으면 내일
    if(delay< 25*3600*1000){
      nudgeTimers.push(setTimeout(()=>{
        try{ new Notification("60초 리셋", {body:NUDGE_MSGS[i%NUDGE_MSGS.length]}); }catch(_){}
      },delay));
    }
  }
}

/* ============================================================
   부팅
   ============================================================ */
refreshGreeting();
show("home");
save(K.lastOpen,new Date().toISOString());
scheduleNudges();

/* PWA: 설치 + 오프라인 (http(s)로 서빙될 때만 등록) */
if("serviceWorker" in navigator && location.protocol.indexOf("http")===0){
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}
